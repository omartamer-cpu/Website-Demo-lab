{% extends 'lab4_base.html' %}
{% block lab4_body %}
  <form method="get" action="{{ url_for('lab4_search') }}">
    <label>Title keyword <input name="keyword" value="{{ keyword }}"></label>
    <label>Min price <input name="min_price" value="{{ min_price }}" size="6"></label>
    <label>Max price <input name="max_price" value="{{ max_price }}" size="6"></label>
    <label>Category
      <select name="category_id">
        <option value="">All</option>
        {% for c in categories %}
          <option value="{{ c.category_id }}" {{ 'selected' if category_id == c.category_id|string }}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit">Search</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>
  {% elif books %}
    <table>
      <tr><th>ID</th><th>Title</th><th>Price</th><th>Category</th></tr>
      {% for b in books %}<tr><td>{{ b.book_id }}</td><td>{{ b.title }}</td><td>{{ b.price }}</td><td>{{ b.category }}</td></tr>{% endfor %}
    </table>
  {% else %}<p>No books match your search.</p>{% endif %}
{% endblock %}wh
